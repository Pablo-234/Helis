[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helis"
version = "0.1.0"
description = "Autonomous venture discovery and validation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
helis = "helis.cli:app"
helis-preview = "helis.preview_cli:app"
helis-gtm = "helis.gtm_cli:app"
helis-portfolio = "helis.portfolio_cli:app"
helis-venture = "helis.venture_cli:app"
helis-agent = "helis.child_agent_cli:app"
helis-autopilot = "helis.autopilot_cli:app"
helis-scheduler = "helis.scheduler_cli:app"
helis-discovery = "helis.discovery_cli:app"
helis-self = "helis.self_improvement_cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
